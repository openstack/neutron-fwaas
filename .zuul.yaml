- project:
    templates:
      - check-requirements
      - openstack-cover-jobs-neutron
      - openstack-python3-jobs-neutron
      - periodic-stable-jobs-neutron
      - publish-openstack-docs-pti
      - release-notes-jobs-python3
    check:
      jobs:
        - openstack-tox-docs:
            required-projects: &fwaas_required_projects
              - openstack/neutron-lib
              - openstack/neutron
        - neutron-fwaas-functional
        - neutron-tempest-plugin-fwaas-ovn
        - neutron-tempest-plugin-fwaas-openvswitch
    gate:
      jobs:
        - openstack-tox-docs:
            required-projects: *fwaas_required_projects
        - neutron-fwaas-functional
        - neutron-tempest-plugin-fwaas-ovn
        - neutron-tempest-plugin-fwaas-openvswitch
    experimental:
      jobs:
        - openstack-tox-py314-with-oslo-master:
            required-projects: *fwaas_required_projects
    periodic-weekly:
      jobs:
        - openstack-tox-py314:
            required-projects: *fwaas_required_projects
        - openstack-tox-py314-with-oslo-master:
            required-projects: *fwaas_required_projects
        - neutron-fwaas-functional
        - neutron-tempest-plugin-fwaas-ovn
        - neutron-tempest-plugin-fwaas-openvswitch

- job:
    name: neutron-fwaas-functional
    parent: neutron-functional
    timeout: 2400
    pre-run: playbooks/configure_functional_job.yaml
    vars:
      project_name: neutron-fwaas
      devstack_services:
        INSTALL_OVN: false
