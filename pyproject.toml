[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "neutron-fwaas"
description = "OpenStack Networking FWaaS"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.11"
classifiers = [
  "Environment :: OpenStack",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://docs.openstack.org/neutron-fwaas/latest/"
Repository = "https://opendev.org/openstack/neutron-fwaas"

[tool.setuptools.packages.find]
include = ["neutron_fwaas*"]

[tool.setuptools.data-files]
"etc/neutron/rootwrap.d" = [
    "etc/neutron/rootwrap.d/fwaas-privsep.filters",
]

[project.entry-points."oslo.config.opts"]
"neutron.fwaas" = "neutron_fwaas.opts:list_opts"
"firewall.agent" = "neutron_fwaas.opts:list_agent_opts"

[project.entry-points."firewall_drivers"]
iptables_v2 = "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.iptables_fwaas_v2:IptablesFwaasDriver"

[project.entry-points."neutron.service_plugins"]
firewall_v2 = "neutron_fwaas.services.firewall.fwaas_plugin_v2:FirewallPluginV2"

[project.entry-points."neutron.db.alembic_migrations"]
neutron-fwaas = "neutron_fwaas.db.migration:alembic_migrations"

[project.entry-points."oslo.policy.policies"]
neutron-fwaas = "neutron_fwaas.policies:list_rules"

[project.entry-points."neutron.policies"]
neutron-fwaas = "neutron_fwaas.policies:list_rules"

[project.entry-points."neutron.agent.l2.extensions"]
fwaas_v2 = "neutron_fwaas.services.firewall.service_drivers.agents.l2.fwaas_v2:FWaaSV2AgentExtension"

[project.entry-points."neutron.agent.l2.firewall_drivers"]
noop = "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.l2.noop.noop_driver:NoopFirewallL2Driver"
ovs = "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.l2.openvswitch_firewall.firewall:OVSFirewallDriver"

[project.entry-points."neutron.agent.l3.extensions"]
fwaas_v2 = "neutron_fwaas.services.firewall.service_drivers.agents.l3reference.firewall_l3_agent_v2:L3WithFWaaS"
fwaas_v2_log = "neutron_fwaas.services.logapi.agents.l3.fwg_log:FWaaSL3LoggingExtension"

[project.entry-points."neutron.agent.l3.firewall_drivers"]
conntrack = "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.legacy_conntrack:ConntrackLegacy"
netlink_conntrack = "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.netlink_conntrack:ConntrackNetlink"

[project.entry-points."neutron.services.logapi.drivers"]
fwaas_v2_log = "neutron_fwaas.services.logapi.agents.drivers.iptables.log:IptablesLoggingDriver"

[project.entry-points."neutron.status.upgrade.checks"]
neutron_fwaas = "neutron_fwaas.cmd.upgrade_checks.checks:Checks"

[project.entry-points."neutron.ovn.db_sync"]
neutron_fwaas_nb_sync = "neutron_fwaas.services.firewall.service_drivers.ovn.ovn_db_sync:OvnNbDbSync"

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_context = true
show_column_numbers = true
disallow_incomplete_defs = true
warn_unused_ignores = true
# remove gradually as progress is made
disable_error_code = ["import-untyped", "var-annotated"]
files = ["neutron_fwaas"]
exclude = "(?x)(^neutron_fwaas/tests/|^neutron_fwaas/privileged/tests/)"

# Modules listed here are fully annotated; keep it that way. Add a module (or
# package glob) once it passes, and never remove one. Once everything outside
# the tests is listed, move these options to the global section.
[[tool.mypy.overrides]]
module = [
    "neutron_fwaas._i18n",
    "neutron_fwaas.cmd.upgrade_checks.checks",
    "neutron_fwaas.common.exceptions",
    "neutron_fwaas.common.fwaas_constants",
    "neutron_fwaas.common.resources",
    "neutron_fwaas.common.utils",
    "neutron_fwaas.db.models.head",
    "neutron_fwaas.extensions.firewall_v2",
    "neutron_fwaas.opts",
    "neutron_fwaas.policies",
    "neutron_fwaas.policies.firewall_group",
    "neutron_fwaas.policies.firewall_policy",
    "neutron_fwaas.policies.firewall_rule",
    "neutron_fwaas.privileged.netlink_constants",
    "neutron_fwaas.services.firewall.service_drivers.agents.drivers.conntrack_base",
    "neutron_fwaas.services.firewall.service_drivers.agents.drivers.fwaas_base_v2",
    "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.l2.driver_base",
    "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.l2.noop.noop_driver",
    "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.l2.openvswitch_firewall.constants",
    "neutron_fwaas.services.firewall.service_drivers.agents.drivers.linux.l2.openvswitch_firewall.exceptions",
    "neutron_fwaas.services.firewall.service_drivers.agents.firewall_service",
    "neutron_fwaas.services.firewall.service_drivers.driver_api",
    "neutron_fwaas.services.firewall.service_drivers.ovn.constants",
    "neutron_fwaas.services.firewall.service_drivers.ovn.exceptions",
    "neutron_fwaas.services.logapi.agents.drivers.iptables.driver",
    "neutron_fwaas.services.logapi.agents.l3.fwg_log",
    "neutron_fwaas.services.logapi.constants",
    "neutron_fwaas.services.logapi.exceptions",
    "neutron_fwaas.services.logapi.rpc.log_server",
    "neutron_fwaas.version",
]
disallow_untyped_defs = true
